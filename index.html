<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smanda's Elegant Library</title>

<script type="module">
  // --- FIREBASE CORE SYSTEM ---
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();
  
  const ADMIN_EMAILS = ["arvnn.ad4m@gmail.com", "admin2@gmail.com", "kicawmania@gmail.com"]; 

  // --- AUTH FUNCTIONS ---
  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => console.error("Login gagal:", err.message));
  };

  window.loginEmail = function() {
    const email = document.getElementById('email-input').value;
    const pass = document.getElementById('pass-input').value;
    if(email && pass) {
      signInWithEmailAndPassword(auth, email, pass).catch((err) => console.error("Error:", err.message));
    }
  };

  window.registerEmail = function() {
    const email = document.getElementById('email-input').value;
    const pass = document.getElementById('pass-input').value;
    if(email && pass) {
      createUserWithEmailAndPassword(auth, email, pass).catch((err) => console.error("Error:", err.message));
    }
  };

  window.logoutLibrary = function() {
    if(confirm("Apakah Anda yakin ingin keluar?")) {
      signOut(auth).then(() => location.reload());
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.userEmail = user.email;
      window.userName = user.displayName || user.email.split('@')[0];
      
      if(ADMIN_EMAILS.includes(user.email)) {
        document.getElementById('admin-nav-btn').style.display = 'flex';
        document.getElementById('admin-upload-section').style.display = 'block';
        document.getElementById('admin-manage-section').style.display = 'block';
        listenToUserLogs();
      }

      const lp = document.getElementById('landing-page');
      lp.style.opacity = '0';
      setTimeout(() => { lp.style.display = 'none'; }, 800);
      renderHistory(); 
      listenToNewBooks();
    }
  });

  // --- CORE LIBRARY LOGIC ---
  function listenToNewBooks() {
    onValue(ref(db, 'books'), (snapshot) => {
      window.allBooks = snapshot.val();
      updateLibraryUI(window.allBooks);
    });
  }

  // --- LOGGING & HISTORY SYSTEM ---
  window.logToFirebase = function(bookTitle, bookUrl) {
    if (!window.userEmail) return;
    const safeEmail = window.userEmail.replace(/\./g, ',');
    const now = new Date().toLocaleString('id-ID');
    
    // Log untuk admin
    set(ref(db, 'logs/' + safeEmail), {
      name: window.userName,
      email: window.userEmail,
      lastRead: bookTitle,
      time: now
    });

    // Log untuk History User (Simpan URL agar bisa dibuka lagi dari History)
    const historyRef = ref(db, `users/${safeEmail}/history/${bookTitle.replace(/[^a-zA-Z0-9]/g, '')}`);
    set(historyRef, {
      title: bookTitle,
      url: bookUrl,
      time: now
    });
  };

  window.renderHistory = function() {
    if (!window.userEmail) return;
    const safeEmail = window.userEmail.replace(/\./g, ',');
    const list = document.getElementById('history-list');

    onValue(ref(db, `users/${safeEmail}/history`), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        list.innerHTML = Object.values(data).map(x => `
          <div class="book-item">
            <div class="book-box" style="height:150px; background-size: contain; background-repeat: no-repeat; background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('${x.url}', '${x.title}')">
            </div>
            <p class="book-title" style="font-size:0.7em;">${x.title}<br>
            <span style="opacity:0.5">${x.time}</span></p>
          </div>
        `).join('');
      } else {
        list.innerHTML = "<p style='opacity:0.5; grid-column: 1/-1;'>Belum ada riwayat membaca.</p>";
      }
    });
  };

  window.openBook = function(url, title){
    window.currentActiveTitle = title;
    window.currentActiveUrl = url;
    
    // Trigger log setiap kali buku dibuka
    window.logToFirebase(title, url);
    
    document.getElementById('book-frame').src = url;
    showPage('reader');
  };

  window.filterBooks = function() {
    const searchTerm = document.getElementById('search-input').value.toLowerCase();
    const filtered = {};
    if(window.allBooks) {
        Object.entries(window.allBooks).forEach(([key, book]) => {
            if(book.title.toLowerCase().includes(searchTerm)) filtered[key] = book;
        });
    }
    updateLibraryUI(filtered, searchTerm);
    document.querySelectorAll('.static-book').forEach(book => {
        const title = book.querySelector('.book-title').innerText.toLowerCase();
        book.style.display = title.includes(searchTerm) ? "flex" : "none";
    });
  };

  function updateLibraryUI(data, filterText = "") {
      const container = document.getElementById('dynamic-books');
      const manageBody = document.getElementById('admin-manage-body');
      if (data && Object.keys(data).length > 0) {
        const bookEntries = Object.entries(data);
        const lastIndex = bookEntries.length - 1;
        container.innerHTML = bookEntries.map(([key, book], index) => `
          <div class="book-item">
            ${index === lastIndex && filterText === "" ? '<span class="badge-new">NEW</span>' : ''}
            <div class="book-tooltip">${book.desc}</div>
            <div class="book-box" style="background-image: url('${book.cover}');" onclick="playClick(); openBook('${book.url}', '${book.title}')"></div>
            <p class="book-title">${book.title}</p>
          </div>
        `).join('');
        if(manageBody && filterText === "") {
            manageBody.innerHTML = bookEntries.map(([key, book]) => `
            <tr><td>${book.title}</td><td><button onclick="deleteBook('${key}')" style="background:#ff5252; border:none; color:white; padding:5px 10px; border-radius:4px; cursor:pointer;">Hapus</button></td></tr>
            `).join('');
        }
      } else { container.innerHTML = ""; }
  }

  window.deleteBook = function(key) {
    if(confirm("Hapus majalah ini dari rak?")) { remove(ref(db, 'books/' + key)); }
  };

  window.addNewBook = function() {
    const title = document.getElementById('btitle').value;
    const url = document.getElementById('burl').value;
    const cover = document.getElementById('bcover').value || 'https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg';
    const desc = document.getElementById('bdesc').value;
    if(title && url) {
      push(ref(db, 'books'), { title, url, cover, desc });
      alert("Buku berhasil ditambahkan!");
      document.querySelectorAll('.admin-input').forEach(i => i.value = '');
    }
  };

  function listenToUserLogs() {
    onValue(ref(db, 'logs'), (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('admin-log-body');
      if (data) {
        tbody.innerHTML = Object.values(data).map(user => `
          <tr><td>${user.name}</td><td style="font-size:0.8em">${user.email}</td><td style="color:#d4af37; font-weight:bold">${user.lastRead}</td><td style="font-size:0.8em; opacity:0.6">${user.time}</td></tr>
        `).join('');
      }
    });
  }
</script>

<style>
/* --- BASE STYLE --- */
#landing-page {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle, #4e342e 0%, #1a0f0d 100%); 
  display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.8s ease;
  overflow-y: auto; padding: 20px 0;
}
.logo-landing { width: 100px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }
.welcome-title {
  font-size: 2em; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; text-align: center;
  background: linear-gradient(to right, #d7ccc8 20%, #fff 50%, #d7ccc8 80%);
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: textShine 4s linear infinite; color: #d7ccc8;
}

.login-box {
  background: rgba(45, 27, 24, 0.8); padding: 25px; border-radius: 15px; border: 1px solid #d4af37;
  width: 300px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.login-input {
  background: rgba(26, 15, 13, 0.9); border: 1px solid rgba(212, 175, 55, 0.5); 
  padding: 10px; color: white; border-radius: 5px; outline: none;
}
.login-input:focus { border-color: #d4af37; }

.enter-btn { background: #5d4037; color: #fff; border: 1px solid #d4af37; padding: 10px; border-radius: 30px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 0.8em; }
.enter-btn:hover { background: #d4af37; color: #1a0f0d; box-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
.google-btn { background: #fff; color: #444; border: none; }

body {
  margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #1a0f0d; background-image: radial-gradient(circle at center, #3d2b27 0%, #1a0f0d 100%);
  color: #efebe9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
}

.main-container { width: 100%; max-width: 1100px; margin: 40px auto; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }

.search-container { width: 100%; max-width: 400px; margin-bottom: 30px; position: relative; }
.search-input {
    width: 100%; padding: 12px 20px; background: rgba(45, 27, 24, 0.6); 
    border: 1px solid #d4af37; border-radius: 25px; color: white; outline: none;
    transition: 0.3s; box-sizing: border-box; text-align: center;
}

.library-shelf {
  width: 100%; background: #2d1b18; border: 12px solid #1a0f0d;
  box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 0 30px 60px rgba(0,0,0,0.6);
  padding: 80px 20px 40px 20px; position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; border-radius: 4px; box-sizing: border-box;
}

.book-item { display: flex; flex-direction: column; align-items: center; width: 170px; z-index: 2; margin-bottom: 20px; position: relative; }
.book-box {
  width: 160px; height: 230px; background-size: cover; background-position: center; border-radius: 2px 8px 8px 2px; cursor: pointer; position: relative; transition: all 0.5s; box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
  -webkit-box-reflect: below 2px linear-gradient(transparent, transparent 50%, rgba(255,255,255,0.1));
}
.book-box:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); }

.book-title {
  margin-top: 25px; font-weight: bold; font-size: 0.9em; text-align: center; color: #d7ccc8;
}

/* --- FIX: HISTORY IMAGE NOT CROPPED --- */
#history-list .book-box {
    background-size: contain !important;
    background-repeat: no-repeat;
    background-position: center;
}

#history-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 40px 20px; justify-items: center; width: 100%; padding: 20px 0 120px 0;
}

.admin-card { width: 100%; max-width: 900px; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 20px; border: 1px solid rgba(212, 175, 55, 0.2); margin-bottom: 20px; }
.admin-input { width: 100%; padding: 10px; margin: 10px 0; background: #2d1b18; border: 1px solid #d4af37; color: white; border-radius: 5px; box-sizing: border-box; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 12px; border-bottom: 1px solid #d4af37; color: #d4af37; font-size: 0.8em; }
td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9em; }

nav {
  position: fixed; bottom: 0; width: 100%; background: rgba(26, 15, 13, 0.95); backdrop-filter: blur(8px);
  display: flex; justify-content: center; gap: 15px; padding: 20px 0; z-index: 100; border-top: 1px solid rgba(212, 175, 55, 0.2);
}
.nav-btn {
  background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: all 0.3s; font-size: 0.8em;
}
.nav-btn:hover { background: #d4af37; color: #1a0f0d; transform: translateY(-5px); }

.page { display: none; width: 100%; padding-bottom: 120px; }
.active { display: block; }

#reader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; display:none; flex-direction: column;}
#reader.active { display: flex; }
iframe { width: 100%; flex-grow: 1; border: none; }

.reader-header {
  background: #1a0f0d; padding: 10px 20px; display: flex; align-items: center;
  border-bottom: 1px solid #d4af37; color: #d4af37;
}
</style>
</head>

<body>

<audio id="click-sfx" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="bg-music" src="https://raw.githubusercontent.com/arvnnad4m-jpg/chill-backsound/bdf81b6bee6dd2efd7219431a2f09b4a9132e533/felixdump-love-shine-by-leeheesang-instrumental.mp3" loop></audio>

<div id="landing-page">
  <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" class="logo-landing">
  <div class="welcome-title">Smanda Library</div>
  
  <div class="login-box">
    <input type="email" id="email-input" class="login-input" placeholder="Email Address">
    <input type="password" id="pass-input" class="login-input" placeholder="Password">
    <button class="enter-btn" onclick="playClick(); loginEmail()">Login Email</button>
    <button class="enter-btn" style="background:transparent; border:none; font-size:0.65em; opacity:0.7" onclick="registerEmail()">Belum punya akun? Daftar</button>
    <div style="text-align:center; color:#d4af37; font-size:0.8em; margin:5px 0;">OR</div>
    <button class="enter-btn google-btn" onclick="playClick(); startLibrary()">Login with Google</button>
  </div>
</div>

<div id="home" class="page active">
  <div class="main-container">
    <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" style="width:80px; margin-bottom:10px;">
    <h2 class="welcome-title">Digital Archive</h2>
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Cari majalah..." onkeyup="filterBooks()">
    </div>
    <div class="library-shelf">
      <div id="dynamic-books" style="display:contents"></div>
      
      <div class="book-item static-book">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="playClick(); openBook('https://heyzine.com/flip-book/905f390c0d.html', 'Smanda Vibes (November)')"></div>
        <p class="book-title">Smanda Vibes<br>(November Edition)</p>
      </div>
      <div class="book-item static-book">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="playClick(); openBook('https://heyzine.com/flip-book/44752310d5.html', 'Smanda Vibes (January)')"></div>
        <p class="book-title">Smanda Vibes<br>(January Edition)</p>
      </div>
      <div class="book-item static-book">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="playClick(); openBook('https://heyzine.com/flip-book/08b8d4b8c7.html', 'Smanda Vibes (February)')"></div>
        <p class="book-title">Smanda Vibes<br>(February Edition)</p>
      </div>
      <div class="book-item static-book">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="playClick(); openBook('https://online.fliphtml5.com/owlqz/bxoy/', 'Smanda Vibes (March)')"></div>
        <p class="book-title">Smanda Vibes<br>(March Edition)</p>
      </div>
    </div>
  </div>
</div>

<div id="history-page" class="page">
  <div class="main-container">
    <h2 class="welcome-title">Your Reading History</h2>
    <div id="history-list"></div>
  </div>
</div>

<div id="admin-page" class="page">
  <div class="main-container">
    <h2 class="welcome-title">Admin Control</h2>
    <div class="admin-card" id="admin-upload-section" style="display:none;">
      <input type="text" id="btitle" class="admin-input" placeholder="Judul Majalah">
      <input type="text" id="burl" class="admin-input" placeholder="URL Heyzine">
      <input type="text" id="bcover" class="admin-input" placeholder="URL Gambar Cover">
      <input type="text" id="bdesc" class="admin-input" placeholder="Deskripsi Singkat">
      <button class="enter-btn" onclick="addNewBook()" style="width:100%;">Tambahkan</button>
    </div>
    <div class="admin-card">
      <h3 style="color:#d4af37;">User Activity</h3>
      <table><thead><tr><th>User</th><th>Email</th><th>Reading</th><th>Waktu</th></tr></thead><tbody id="admin-log-body"></tbody></table>
    </div>
  </div>
</div>

<div id="reader" class="page">
  <div class="reader-header">
    <button class="nav-btn" style="padding:5px 15px;" onclick="playClick(); showPage('home')">← KELUAR</button>
  </div>
  <iframe id="book-frame" src="" allowfullscreen></iframe>
</div>

<nav>
  <button class="nav-btn" onclick="playClick(); showPage('home')">Main Lobby</button>
  <button class="nav-btn" onclick="playClick(); showPage('history-page')">History</button>
  <button class="nav-btn" id="admin-nav-btn" style="display:none;" onclick="playClick(); showPage('admin-page')">Admin</button>
  <button class="nav-btn" id="music-toggle" onclick="toggleMusic()">Music</button>
  <button class="nav-btn" onclick="logoutLibrary()" style="color:#ff5252;">Logout</button>
</nav>

<script>
const bgMusic = document.getElementById('bg-music');
function playClick() { document.getElementById('click-sfx').play(); }

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'home') document.getElementById('book-frame').src = "";
}

function toggleMusic() {
  if (bgMusic.paused) { bgMusic.play(); } else { bgMusic.pause(); }
}
</script>

</body>
</html>
