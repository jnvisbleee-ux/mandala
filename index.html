<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smanda's Elegant Library</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549",
    measurementId: "G-3Y8HD5WFH7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => alert("Login gagal: " + err.message));
  };

  window.logoutLibrary = function() {
    if(confirm("Apakah Anda yakin ingin keluar?")) {
      signOut(auth).then(() => location.reload());
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.currentUser = user.displayName;
      window.userEmail = user.email;
      document.getElementById('user-greeting').textContent = "Halo, " + user.displayName + "!";
      
      // Cek akses admin (Ganti email di bawah dengan email Anda)
      if(user.email === "admin@pustaka.com") {
        document.getElementById('admin-btn').style.display = 'flex';
      }

      const lp = document.getElementById('landing-page');
      lp.style.opacity = '0';
      setTimeout(() => { lp.style.display = 'none'; }, 800);
      if (bgMusic.paused) { bgMusic.play().catch(() => {}); }
      renderHistory();
    }
  });

  // Fitur Statistik Pembaca (Firestore)
  window.updateStats = async function(bookTitle) {
    const statRef = doc(db, "stats", bookTitle);
    await setDoc(statRef, { views: increment(1) }, { merge: true });
  };
</script>

<style>
/* --- SEMUA CSS ASLI (100% Sama dengan file Anda) --- */
#landing-page { position: fixed; inset: 0; background: radial-gradient(circle, #4e342e 0%, #1a0f0d 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: opacity 0.8s ease; }
.logo-landing { width: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }

.enter-btn { background: #5d4037; color: #fff; border: 1px solid #d4af37; padding: 12px 45px; border-radius: 30px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; }
body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #1a0f0d; background-image: radial-gradient(circle at center, #3d2b27 0%, #1a0f0d 100%); color: #efebe9; min-height: 100vh; overflow-x: hidden; }
.dust-particle { position: fixed; background: #ffd700; border-radius: 50%; pointer-events: none; z-index: 1; opacity: 0; animation: float-dust linear infinite; }
@keyframes float-dust { 0% { transform: translateY(0) translateX(0); opacity: 0; } 100% { transform: translateY(-100vh) translateX(40px); opacity: 0; } }
.main-container { width: 100%; max-width: 1100px; margin: 40px auto; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
.library-shelf { width: 100%; background: #2d1b18; border: 12px solid #1a0f0d; box-shadow: inset 0 0 100px #000; padding: 80px 20px 40px; position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
.shelf-lamp { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 160px; height: 15px; background: #444; border-bottom: 3px solid #d4af37; }
.book-item { display: flex; flex-direction: column; align-items: center; width: 170px; z-index: 2; position: relative; animation: float-book 6s ease-in-out infinite; }
.book-box { width: 160px; height: 230px; background-size: cover; border-radius: 2px 8px 8px 2px; cursor: pointer; transition: 0.5s; box-shadow: -5px 5px 15px #000; }
.book-box:hover { transform: scale(1.05); box-shadow: 0 0 30px #d4af37; }
.book-title { margin-top: 25px; font-weight: bold; font-size: 0.9em; text-align: center; color: #d7ccc8; }
.badge-new { position: absolute; top: -10px; right: -10px; background: #d4af37; color: #1a0f0d; padding: 4px 8px; border-radius: 4px; font-size: 0.7em; z-index: 10; }
.book-upcoming { background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg'); filter: grayscale(1) brightness(0.4); opacity: 0.7; }
.coming-soon-tag { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); background: #d4af37; color: #1a0f0d; padding: 8px 15px; font-weight: bold; }
nav { position: fixed; bottom: 0; width: 100%; background: rgba(26, 15, 13, 0.95); display: flex; justify-content: center; gap: 15px; padding: 15px 0; z-index: 100; border-top: 1px solid rgba(212, 175, 55, 0.2); }
.nav-btn { background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; }
.nav-btn:hover { background: #d4af37; color: #1a0f0d; }
.btn-logout { border-color: #ff5252; color: #ff5252; }
.page { display: none; width: 100%; padding-bottom: 120px; }
.active { display: block; }
#reader { position: fixed; inset: 0; z-index: 2000; background: #000; }
iframe { width: 100%; height: calc(100vh - 65px); border: none; }
#search-container { margin-bottom: 30px; width: 100%; max-width: 400px; }
#search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid #d4af37; background: rgba(45, 27, 24, 0.8); color: white; outline: none; }
.progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); margin-top: 10px; }
.progress-fill { height: 100%; background: #d4af37; }
@keyframes textShine { to { background-position: 200% center; } }
</style>
</head>

<body>

  <button class="nav-btn" onclick="showPage('home')">Main Lobby</button>

  <button class="nav-btn btn-logout" onclick="logoutLibrary()">Logout</button>

<script>
const bgMusic = document.getElementById('bg-music');

function createDust() {
  for (let i = 0; i < 40; i++) {
    let dust = document.createElement('div');
    dust.className = 'dust-particle';
    let size = Math.random() * 3 + 1 + 'px';
    dust.style.width = size; dust.style.height = size;
    dust.style.left = Math.random() * 100 + 'vw'; dust.style.top = Math.random() * 100 + 'vh';
    dust.style.animationDuration = Math.random() * 8 + 12 + 's';
    document.body.appendChild(dust);
  }
}
window.onload = createDust;

function playClick() { document.getElementById('click-sfx').play(); }

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openBook(url, title){
  // Bookmark & History logic
  saveHistory(title, url);
  // Statistik logic
  if(window.updateStats) window.updateStats(title);
  
  document.getElementById('book-frame').src = url;
  showPage('reader');
}

function searchBooks() {
  let input = document.getElementById('search-input').value.toLowerCase();
  let books = document.querySelectorAll('.book-item');
  books.forEach(book => {
    let title = book.getAttribute('data-title')?.toLowerCase() || "";
    book.style.display = title.includes(input) ? "flex" : "none";
  });
}

function downloadPDF() {
  alert("Menyiapkan unduhan PDF...");
  // Logika: window.open(link_pdf_langsung);
}

function saveHistory(title, url) {
  let key = "smanda_history_" + (window.userEmail || "guest");
  let history = JSON.parse(localStorage.getItem(key)) || [];
  history = history.filter(item => item.title !== title);
  let progress = Math.floor(Math.random() * 50) + 50; 
  history.unshift({ title, url, progress });
  localStorage.setItem(key, JSON.stringify(history.slice(0, 8)));
}

function renderHistory() {
  const key = "smanda_history_" + (window.userEmail || "guest");
  const history = JSON.parse(localStorage.getItem(key)) || [];
  const list = document.getElementById('history-list');
  list.innerHTML = history.map(h => `
    <div class="book-item" style="width:130px; animation:none;">
      <div class="book-box" style="width:120px; height:170px; background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" 
           onclick="openBook('${h.url}', '${h.title}')"></div>
      <p class="book-title" style="font-size:0.7em;">${h.title}</p>
      <div class="progress-container"><div class="progress-fill" style="width:${h.progress}%"></div></div>
    </div>
  `).join('');
}
</script>
</body>
</html>
