<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smanda's Elegant Library</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();
  const ADMIN_EMAIL = "arvnn.ad4m@gmail.com";

  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => alert("Login gagal: " + err.message));
  };

  window.logoutLibrary = function() {
    if(confirm("Apakah Anda yakin ingin keluar?")) {
      signOut(auth).then(() => location.reload());
    }
  };

  // --- ADMIN FEATURE: ADD BOOK ---
  window.addNewBook = function() {
    const title = document.getElementById('new-book-title').value;
    const url = document.getElementById('new-book-url').value;
    const cover = document.getElementById('new-book-cover').value || 'https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg';

    if(title && url) {
      const booksRef = ref(db, 'books');
      push(booksRef, { title, url, cover, timestamp: Date.now() })
      .then(() => {
        alert("Majalah berhasil ditambahkan!");
        document.getElementById('add-book-form').reset();
      });
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.userEmail = user.email;
      window.userName = user.displayName;
      
      if(user.email === ADMIN_EMAIL) {
        document.getElementById('admin-nav-btn').style.display = 'flex';
        document.getElementById('admin-add-section').style.display = 'block';
        listenToUserLogs();
      }

      const lp = document.getElementById('landing-page');
      lp.style.opacity = '0';
      setTimeout(() => { lp.style.display = 'none'; }, 800);
      
      listenToBooks();
      renderHistory();
    }
  });

  function listenToBooks() {
    onValue(ref(db, 'books'), (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('dynamic-books');
      container.innerHTML = '';
      if(data) {
        Object.values(data).reverse().map(book => {
          container.innerHTML += `
            <div class="book-item">
              <span class="badge-new">NEW</span>
              <div class="book-box" style="background-image: url('${book.cover}');" onclick="playClick(); openBook('${book.url}', '${book.title}')"></div>
              <p class="book-title">${book.title}</p>
            </div>`;
        });
      }
    });
  }

  window.logToFirebase = function(bookTitle) {
    if (!window.userEmail) return;
    const safeEmail = window.userEmail.replace(/\./g, ',');
    set(ref(db, 'logs/' + safeEmail), {
      name: window.userName,
      email: window.userEmail,
      lastRead: bookTitle,
      time: new Date().toLocaleString('id-ID')
    });
  };

  function listenToUserLogs() {
    onValue(ref(db, 'logs'), (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('admin-log-body');
      if (data) {
        tbody.innerHTML = Object.values(data).map(user => `
          <tr>
            <td>${user.name}</td>
            <td style="font-size:0.8em">${user.email}</td>
            <td style="color:#d4af37; font-weight:bold">${user.lastRead}</td>
            <td style="font-size:0.8em; opacity:0.6">${user.time}</td>
          </tr>
        `).join('');
      }
    });
  }
</script>

<style>
/* --- STYLES REMAINING INTACT --- */
#landing-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #4e342e 0%, #1a0f0d 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.8s ease; }
.logo-landing { width: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }
.welcome-title { font-size: 2.2em; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; text-align: center; background: linear-gradient(to right, #d7ccc8 20%, #fff 50%, #d7ccc8 80%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: textShine 4s linear infinite; color: #d7ccc8; }
.enter-btn { background: #5d4037; color: #fff; border: 1px solid #d4af37; padding: 12px 45px; border-radius: 30px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; }
.enter-btn:hover { background: #d4af37; color: #1a0f0d; box-shadow: 0 0 25px rgba(212, 175, 55, 0.5); }
body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a0f0d; background-image: radial-gradient(circle at center, #3d2b27 0%, #1a0f0d 100%); color: #efebe9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
.main-container { width: 100%; max-width: 1100px; margin: 40px auto; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
.library-shelf { width: 100%; background: #2d1b18; border: 12px solid #1a0f0d; box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 0 30px 60px rgba(0,0,0,0.6); padding: 80px 20px 40px 20px; position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; border-radius: 4px; box-sizing: border-box; }
.shelf-lamp { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 160px; height: 15px; background: linear-gradient(to bottom, #444, #222); border-bottom: 3px solid #d4af37; border-radius: 8px 8px 0 0; z-index: 10; }
.lamp-glow { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 700px; height: 350px; background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.15) 0%, transparent 75%); pointer-events: none; }
.book-item { display: flex; flex-direction: column; align-items: center; width: 170px; z-index: 2; margin-bottom: 20px; position: relative; animation: float-book 6s ease-in-out infinite; }
.book-box { width: 160px; height: 230px; background-size: cover; background-position: center; border-radius: 2px 8px 8px 2px; cursor: pointer; position: relative; transition: all 0.5s; box-shadow: -5px 5px 15px rgba(0,0,0,0.5); -webkit-box-reflect: below 2px linear-gradient(transparent, transparent 50%, rgba(255,255,255,0.1)); }
.book-box:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); }
.book-title { margin-top: 25px; font-weight: bold; font-size: 0.9em; text-align: center; color: #d7ccc8; }
.badge-new { position: absolute; top: -10px; right: -10px; background: #d4af37; color: #1a0f0d; padding: 4px 8px; border-radius: 4px; font-size: 0.7em; font-weight: bold; box-shadow: 0 0 15px #d4af37; z-index: 10; }

/* Coming Soon Style */
.coming-soon { opacity: 0.4; filter: grayscale(1); cursor: not-allowed !important; border: 2px dashed #d4af37; background: rgba(0,0,0,0.4) !important; }
.badge-soon { background: #555 !important; color: #fff !important; box-shadow: none !important; }

/* Admin Form Style */
.admin-card { width: 100%; max-width: 900px; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 20px; border: 1px solid rgba(212, 175, 55, 0.2); margin-bottom: 20px; }
.admin-input { background: rgba(255,255,255,0.1); border: 1px solid #d4af37; color: white; padding: 10px; border-radius: 5px; width: calc(33% - 20px); margin: 5px; box-sizing: border-box; }
.admin-add-btn { background: #d4af37; color: #1a0f0d; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-left: 5px; }

table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th { text-align: left; padding: 12px; border-bottom: 1px solid #d4af37; color: #d4af37; font-size: 0.8em; }
td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9em; }
nav { position: fixed; bottom: 0; width: 100%; background: rgba(26, 15, 13, 0.95); backdrop-filter: blur(8px); display: flex; justify-content: center; gap: 15px; padding: 20px 0; z-index: 100; border-top: 1px solid rgba(212, 175, 55, 0.2); }
.nav-btn { background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.8em; }
.page { display: none; width: 100%; padding-bottom: 120px; }
.active { display: block; }
#reader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; }
iframe { width: 100%; height: calc(100vh - 65px); border: none; }
</style>
</head>

<body>

<audio id="click-sfx" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="bg-music" src="https://raw.githubusercontent.com/arvnnad4m-jpg/chill-backsound/bdf81b6bee6dd2efd7219431a2f09b4a9132e533/felixdump-love-shine-by-leeheesang-instrumental.mp3" loop></audio>

<div id="landing-page">
  <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" class="logo-landing">
  <div class="welcome-title">Smanda Library</div>
  <button class="enter-btn" onclick="playClick(); startLibrary()">Masuk Koleksi</button>
</div>

<div id="home" class="page active">
  <div class="main-container">
    <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" class="logo-main" style="width:80px; margin-bottom:10px;">
    <h2 class="welcome-title">Digital Archive</h2>

    <div class="library-shelf">
      <div class="shelf-lamp"></div>
      <div class="lamp-glow"></div>
      
      <div id="dynamic-books" style="display:contents;"></div>

      <div class="book-item">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="playClick(); openBook('https://heyzine.com/flip-book/1caa336792.html', 'Smanda Vibes (April)')"></div>
        <p class="book-title">Smanda Vibes<br>(April Edition)</p>
      </div>

      <div class="book-item">
        <span class="badge-new badge-soon">SOON</span>
        <div class="book-box coming-soon"></div>
        <p class="book-title" style="opacity:0.5">Next Edition<br>(Coming Soon)</p>
      </div>
    </div>
  </div>
</div>

<div id="admin-page" class="page">
  <div class="main-container">
    <h2 class="welcome-title">Admin Panel</h2>
    
    <div class="admin-card" id="admin-add-section" style="display:none;">
      <h3 style="color:#d4af37; margin-top:0;">+ Tambah Majalah Baru</h3>
      <form id="add-book-form" onsubmit="event.preventDefault(); addNewBook();">
        <input type="text" id="new-book-title" class="admin-input" placeholder="Judul (Edisi Mei)" required>
        <input type="url" id="new-book-url" class="admin-input" placeholder="URL Majalah" required>
        <input type="url" id="new-book-cover" class="admin-input" placeholder="URL Cover (Opsional)">
        <button type="submit" class="admin-add-btn">Posting</button>
      </form>
    </div>

    <div class="admin-card">
      <h3 style="color:#d4af37; margin-top:0;">User Activity Logs</h3>
      <table>
        <thead>
          <tr><th>User</th><th>Email</th><th>Reading</th><th>Waktu</th></tr>
        </thead>
        <tbody id="admin-log-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="history-page" class="page">
  <div class="main-container">
    <h2 class="welcome-title">Reading History</h2>
    <div id="history-list" style="display:flex; flex-wrap:wrap; gap:30px; justify-content:center;"></div>
  </div>
</div>

<div id="reader" class="page">
  <button class="nav-btn" style="width:100%; border-radius:0; justify-content:center;" onclick="playClick(); showPage('home')">← KEMBALI KE RAK</button>
  <iframe id="book-frame" src="" allowfullscreen></iframe>
</div>

<nav>
  <button class="nav-btn" onclick="playClick(); showPage('home')">Lobby</button>
  <button class="nav-btn" onclick="playClick(); renderHistory(); showPage('history-page')">History</button>
  <button class="nav-btn" id="admin-nav-btn" style="display:none;" onclick="playClick(); showPage('admin-page')">Admin</button>
  <button class="nav-btn" onclick="playClick(); toggleMusic()"><span id="music-text">Play Music</span></button>
  <button class="nav-btn" onclick="logoutLibrary()" style="color:#ff5252; border-color:#ff5252;">Logout</button>
</nav>

<script>
const bgMusic = document.getElementById('bg-music');
function playClick() { const sfx = document.getElementById('click-sfx'); sfx.currentTime = 0; sfx.play(); }
function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'home') { document.getElementById('book-frame').src = ""; bgMusic.volume = 1.0; } 
  else if(id === 'reader') { bgMusic.volume = 0.3; }
}
function openBook(url, title){
  document.getElementById('book-frame').src = url;
  showPage('reader');
  saveToLocalHistory(title, url);
  if(window.logToFirebase) window.logToFirebase(title);
}
function toggleMusic() {
  if (bgMusic.paused) { bgMusic.play(); document.getElementById('music-text').textContent = "Pause Music"; }
  else { bgMusic.pause(); document.getElementById('music-text').textContent = "Play Music"; }
}
function saveToLocalHistory(title, url) {
  let h = JSON.parse(localStorage.getItem('lib_history')) || [];
  h = h.filter(x => x.title !== title);
  h.unshift({title, url, time: new Date().toLocaleDateString()});
  localStorage.setItem('lib_history', JSON.stringify(h.slice(0, 10)));
}
function renderHistory() {
  const h = JSON.parse(localStorage.getItem('lib_history')) || [];
  const list = document.getElementById('history-list');
  list.innerHTML = h.map(x => `
    <div class="book-item">
      <div class="book-box" style="height:150px; background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('${x.url}', '${x.title}')"></div>
      <p class="book-title" style="font-size:0.7em;">${x.title}<br><span style="opacity:0.5">${x.time}</span></p>
    </div>
  `).join('');
}
</script>
</body>
</html>
