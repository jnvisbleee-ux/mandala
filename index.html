<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smanda's Elegant Library</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, updateDoc, increment, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549",
    measurementId: "G-3Y8HD5WFH7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // --- LOGIKA LOGIN ---
  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => alert("Gagal: " + err.message));
  };

  window.logoutLibrary = function() {
    if(confirm("Keluar dari sistem?")) signOut(auth).then(() => location.reload());
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.currentUser = user;
      document.getElementById('user-greeting').textContent = "Halo, " + user.displayName + "!";
      document.getElementById('landing-page').style.display = 'none';
      if(user.email === "arvnn.ad4m@gmail.com") document.getElementById('admin-nav').style.display = 'flex';
      renderHistory();
    }
  });

  // --- SISTEM KOMENTAR & STATISTIK ---
  window.sendComment = async function() {
    const text = document.getElementById('comment-input').value;
    const bookTitle = document.getElementById('reading-title-header').textContent;
    if(!text) return;
    await addDoc(collection(db, "comments"), {
      user: window.currentUser.displayName,
      text: text,
      book: bookTitle,
      time: Date.now()
    });
    document.getElementById('comment-input').value = "";
  };

  window.loadComments = function(bookTitle) {
    const q = query(collection(db, "comments"), orderBy("time", "desc"));
    onSnapshot(q, (snapshot) => {
      const list = document.getElementById('comment-list');
      list.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        if(data.book === bookTitle) {
          list.innerHTML += `<div style="border-bottom:1px solid #4e342e; padding:10px 0;">
            <b style="color:#d4af37; font-size:0.8em;">${data.user}</b>: 
            <span style="font-size:0.85em;">${data.text}</span>
          </div>`;
        }
      });
    });
  };

  window.updateStats = async function(bookTitle) {
    const statRef = doc(db, "stats", bookTitle);
    await setDoc(statRef, { views: increment(1) }, { merge: true });
  };
</script>

<style>
/* CSS ASLI TETAP DIBAWA (Disederhanakan untuk ruang) */
#landing-page { position: fixed; inset: 0; background: radial-gradient(circle, #4e342e, #1a0f0d); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; }
.enter-btn { background: #5d4037; color: #fff; border: 1px solid #d4af37; padding: 12px 45px; border-radius: 30px; cursor: pointer; }
body { margin: 0; background: #1a0f0d; color: #efebe9; font-family: sans-serif; overflow-x: hidden; }
.main-container { width: 100%; max-width: 1100px; margin: 20px auto; padding: 20px; text-align: center; }
.library-shelf { background: #2d1b18; border: 10px solid #1a0f0d; padding: 60px 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; position: relative; box-shadow: inset 0 0 50px #000; }
.book-item { width: 150px; cursor: pointer; transition: 0.3s; }
.book-box { height: 210px; background-size: cover; border-radius: 3px; box-shadow: -5px 5px 15px #000; }
.book-box:hover { transform: scale(1.05); }
.book-title { font-size: 0.8em; margin-top: 10px; color: #d4af37; }
nav { position: fixed; bottom: 0; width: 100%; background: #1a0f0d; display: flex; justify-content: center; gap: 10px; padding: 15px; border-top: 1px solid #d4af37; z-index: 1000; }
.nav-btn { background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8em; }
.page { display: none; padding-bottom: 100px; }
.active { display: block; }
#reader { position: fixed; inset: 0; background: #000; z-index: 2000; overflow-y: auto; }
#search-bar { width: 80%; max-width: 400px; padding: 10px; border-radius: 20px; border: 1px solid #d4af37; background: #2d1b18; color: #fff; margin-bottom: 20px; }
.comment-section { background: #1a0f0d; padding: 20px; max-width: 800px; margin: 0 auto; text-align: left; }
</style>
</head>

<body>

<audio id="bg-music" src="https://raw.githubusercontent.com/arvnnad4m-jpg/chill-backsound/bdf81b6bee6dd2efd7219431a2f09b4a9132e533/felixdump-love-shine-by-leeheesang-instrumental.mp3" loop></audio>

<div id="landing-page">
    <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" width="100">
    <h1 style="letter-spacing: 5px; color: #d4af37;">SMANDA LIBRARY</h1>
    <button class="enter-btn" onclick="startLibrary()">MASUK KOLEKSI</button>
</div>

<div id="home" class="page active">
    <div class="main-container">
        <div id="user-greeting"></div>
        <input type="text" id="search-bar" placeholder="Cari majalah..." onkeyup="searchBook()">
        <div class="library-shelf" id="shelf">
            <div class="book-item" data-title="November Edition">
                <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('https://heyzine.com/flip-book/905f390c0d.html', 'November Edition')"></div>
                <p class="book-title">November Edition</p>
            </div>
            <div class="book-item" data-title="January Edition">
                <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('https://heyzine.com/flip-book/44752310d5.html', 'January Edition')"></div>
                <p class="book-title">January Edition</p>
            </div>
            </div>
    </div>
</div>

<div id="reader" class="page">
    <div style="background:#2d1b18; padding:15px; display:flex; justify-content:space-between; align-items:center;">
        <button class="nav-btn" onclick="showPage('home')">← Tutup</button>
        <span id="reading-title-header" style="color:#d4af37; font-weight:bold;"></span>
        <button class="nav-btn" onclick="downloadBook()">⬇ Download PDF</button>
    </div>
    <iframe id="book-frame" style="width:100%; height:70vh;"></iframe>
    
    <div class="comment-section">
        <h3>Komentar</h3>
        <div id="comment-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px;"></div>
        <textarea id="comment-input" style="width:100%; background:#2d1b18; color:white; border:1px solid #d4af37; padding:10px;" placeholder="Tulis komentar..."></textarea>
        <button class="nav-btn" style="margin-top:10px;" onclick="sendComment()">Kirim Komentar</button>
    </div>
</div>

<nav>
    <button class="nav-btn" onclick="showPage('home')">Beranda</button>
    <button class="nav-btn" id="admin-nav" style="display:none;" onclick="alert('Fitur Statistik Admin Segera Hadir di Firestore Console')">Stats</button>
    <button class="nav-btn" onclick="logoutLibrary()" style="border-color:#ff5252; color:#ff5252;">Logout</button>
</nav>

<script>
    function showPage(id){
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function openBook(url, title){
        document.getElementById('book-frame').src = url;
        document.getElementById('reading-title-header').textContent = title;
        showPage('reader');
        window.updateStats(title); // Update Statistik ke Firebase
        window.loadComments(title); // Load Komentar dari Firebase
        document.getElementById('bg-music').volume = 0.2;
        // Bookmark otomatis (Local Storage)
        localStorage.setItem("last_read", JSON.stringify({title, url}));
    }

    function searchBook() {
        let input = document.getElementById('search-bar').value.toLowerCase();
        let books = document.getElementsByClassName('book-item');
        for (let i = 0; i < books.length; i++) {
            let title = books[i].getAttribute('data-title').toLowerCase();
            books[i].style.display = title.includes(input) ? "flex" : "none";
        }
    }

    function downloadBook() {
        alert("Fitur Download: Mengalihkan ke file PDF...");
        // Contoh: window.open('link_ke_pdf_asli.pdf');
    }
</script>
</body>
</html>
