<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smanda's Elegant Library</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();
  const ADMIN_EMAIL = "arvnn.ad4m@gmail.com";

  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => alert("Login gagal: " + err.message));
  };

  window.logoutLibrary = function() {
    if(confirm("Apakah Anda yakin ingin keluar?")) {
      signOut(auth).then(() => location.reload());
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.userEmail = user.email;
      window.userName = user.displayName;
      
      const greeting = document.getElementById('user-greeting');
      if(user.email === ADMIN_EMAIL) {
        greeting.textContent = "Halo, arv1ent!";
        document.getElementById('admin-nav-btn').style.display = 'flex';
        listenToUserLogs();
      } else {
        greeting.textContent = "Halo, " + user.displayName + "!";
      }

      const lp = document.getElementById('landing-page');
      lp.style.opacity = '0';
      setTimeout(() => { lp.style.display = 'none'; }, 800);
      renderHistory();
    }
  });

  window.logToFirebase = function(bookTitle) {
    if (!window.userEmail) return;
    const safeEmail = window.userEmail.replace(/\./g, ',');
    set(ref(db, 'logs/' + safeEmail), {
      name: window.userName,
      email: window.userEmail,
      lastRead: bookTitle,
      time: new Date().toLocaleString('id-ID')
    });
  };

  function listenToUserLogs() {
    onValue(ref(db, 'logs'), (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('admin-log-body');
      if (data) {
        tbody.innerHTML = Object.values(data).map(user => `
          <tr>
            <td>${user.name}</td>
            <td>${user.lastRead}</td>
            <td style="font-size:0.8em; opacity:0.6">${user.time}</td>
          </tr>
        `).join('');
      }
    });
  }
</script>

<style>
/* --- BASE CSS --- */
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;
  background: #1a0f0d; background-image: radial-gradient(circle at center, #3d2b27 0%, #1a0f0d 100%);
  color: #efebe9; min-height: 100vh; overflow-x: hidden;
}

/* --- LANDING PAGE (PRESISI) --- */
#landing-page {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at center, #4e342e 0%, #1a0f0d 100%); 
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 1000; transition: 0.8s; text-align: center;
}

.logo-container { margin-bottom: 20px; display: flex; justify-content: center; }
.logo-landing { width: 110px; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4)); }

.welcome-title {
  font-size: 2.2em; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 40px;
  background: linear-gradient(to right, #d7ccc8 20%, #fff 50%, #d7ccc8 80%);
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: shine 4s linear infinite;
}

.login-btn-custom {
  background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.5);
  backdrop-filter: blur(10px); color: #fff; padding: 15px 40px; border-radius: 50px;
  font-weight: bold; letter-spacing: 2px; cursor: pointer; transition: 0.4s; text-transform: uppercase;
}
.login-btn-custom:hover { background: #d4af37; color: #1a0f0d; box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); transform: translateY(-3px); }

/* --- MAIN CONTENT --- */
.main-container { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; }
.logo-main { width: 70px; margin-bottom: 15px; }

.search-wrapper { margin: 20px 0 40px 0; width: 100%; max-width: 450px; }
.search-input {
  width: 100%; padding: 14px 25px; border-radius: 30px; border: 1px solid rgba(212, 175, 55, 0.3);
  background: rgba(26, 15, 13, 0.6); color: white; outline: none; text-align: center;
}

.library-shelf {
  background: #2d1b18; border: 12px solid #1a0f0d; border-radius: 4px;
  padding: 80px 20px 40px 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 30px;
  box-shadow: inset 0 0 100px #000; position: relative; width: 100%; max-width: 1050px;
}
.shelf-lamp { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 180px; height: 15px; background: #333; border-bottom: 3px solid #d4af37; }

.book-item { width: 165px; text-align: center; animation: float 6s ease-in-out infinite; }
.book-box {
  width: 100%; height: 240px; background-size: cover; border-radius: 2px 8px 8px 2px;
  cursor: pointer; box-shadow: -5px 10px 20px rgba(0,0,0,0.6); transition: 0.4s;
}
.book-box:hover { transform: scale(1.06) translateY(-10px); box-shadow: 0 0 30px #d4af37; }

/* Mystery Book Style */
.book-locked { filter: grayscale(1) contrast(0.8); position: relative; cursor: not-allowed !important; }
.book-locked::after { content: '🔒'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3em; opacity: 0.7; }

/* --- NAVIGATION --- */
nav {
  position: fixed; bottom: 0; width: 100%; background: rgba(26, 15, 13, 0.96);
  display: flex; justify-content: center; gap: 12px; padding: 18px 0; z-index: 100;
  border-top: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(10px);
}
.nav-btn {
  background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 10px 20px;
  border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 0.75em; display: flex; align-items: center; gap: 8px;
}

@keyframes shine { to { background-position: 200% center; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.equalizer { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
.eq-bar { width: 3px; background: #fff59d; animation: eq 0.5s infinite alternate; animation-play-state: paused; }
@keyframes eq { 0% { height: 4px; } 100% { height: 16px; } }

.page { display: none; width: 100%; }
.active { display: block; }
#reader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; }
iframe { width: 100%; height: calc(100vh - 65px); border: none; }
</style>
</head>
<body>

<audio id="bg-music" src="https://raw.githubusercontent.com/arvnnad4m-jpg/chill-backsound/bdf81b6bee6dd2efd7219431a2f09b4a9132e533/felixdump-love-shine-by-leeheesang-instrumental.mp3" loop></audio>
<audio id="click-sfx" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

<div id="landing-page">
  <div class="logo-container">
    <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" class="logo-landing">
  </div>
  <div class="welcome-title">Smanda Library</div>
  <button class="login-btn-custom" onclick="playClick(); startLibrary()">Akses Koleksi Digital</button>
</div>

<div id="home" class="page active">
  <div class="main-container">
    <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" class="logo-main">
    <div id="user-greeting" style="color:#d4af37; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px;"></div>
    
    <div class="search-wrapper">
      <input type="text" id="search-bar" class="search-input" placeholder="Cari Edisi Majalah..." onkeyup="filterBooks()">
    </div>

    <div class="library-shelf">
      <div class="shelf-lamp"></div>
      
      <div class="book-item" data-title="November Edition">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('https://heyzine.com/flip-book/905f390c0d.html', 'November Edition')"></div>
        <p class="book-title">November Edition</p>
      </div>

      <div class="book-item" data-title="January Edition">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('https://heyzine.com/flip-book/44752310d5.html', 'January Edition')"></div>
        <p class="book-title">January Edition</p>
      </div>

      <div class="book-item" data-title="Secret Edition">
        <div class="book-box book-locked" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="alert('Sssttt! Edisi ini masih dirahasiakan. Tunggu tanggal mainnya ya!')"></div>
        <p class="book-title" style="opacity:0.5">Coming Soon...</p>
      </div>

      <div class="book-item" data-title="April Edition">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('https://heyzine.com/flip-book/1caa336792.html', 'April Edition')"></div>
        <p class="book-title">April Edition</p>
      </div>
    </div>
  </div>
</div>

<div id="history-page" class="page">
  <div class="main-container">
    <h2 style="letter-spacing: 5px;">READING HISTORY</h2>
    <div id="history-list" style="display:flex; flex-wrap:wrap; gap:30px; justify-content:center; width:100%;"></div>
  </div>
</div>

<div id="admin-page" class="page">
  <div class="main-container">
    <h2 style="color:#d4af37">ADMIN LOGS (REAL-TIME)</h2>
    <div style="width:100%; max-width:800px; background:rgba(0,0,0,0.4); border-radius:15px; padding:20px; overflow-x:auto;">
      <table style="width:100%; border-collapse: collapse; text-align:left;">
        <thead style="border-bottom: 2px solid #d4af37;">
          <tr><th style="padding:10px;">User</th><th>Book</th><th>Time</th></tr>
        </thead>
        <tbody id="admin-log-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="reader" class="page">
  <button onclick="playClick(); showPage('home')" style="width:100%; padding:18px; background:#1a0f0d; color:#d4af37; border:none; cursor:pointer; font-weight:bold; border-bottom:1px solid #d4af37;">← KEMBALI KE RAK BUKU</button>
  <iframe id="book-frame" src=""></iframe>
</div>

<nav>
  <button class="nav-btn" onclick="playClick(); showPage('home')">Lobby</button>
  <button class="nav-btn" onclick="playClick(); renderHistory(); showPage('history-page')">History</button>
  <button class="nav-btn" id="admin-nav-btn" style="display:none;" onclick="playClick(); showPage('admin-page')">Admin</button>
  <button class="nav-btn" id="music-btn" onclick="playClick(); toggleMusic()">
    <span id="music-text">Music</span>
    <div class="equalizer"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>
  </button>
  <button class="nav-btn" onclick="logoutLibrary()" style="color:#ff5252; border-color:#ff5252;">Logout</button>
</nav>

<script>
const bgMusic = document.getElementById('bg-music');
const eqBars = document.querySelectorAll('.eq-bar');

function playClick() { document.getElementById('click-sfx').currentTime = 0; document.getElementById('click-sfx').play(); }

function filterBooks() {
  const q = document.getElementById('search-bar').value.toLowerCase();
  document.querySelectorAll('.book-item').forEach(b => {
    b.style.display = b.getAttribute('data-title').toLowerCase().includes(q) ? 'block' : 'none';
  });
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'reader') { fadeVolume(0.2); } 
  else { document.getElementById('book-frame').src = ""; fadeVolume(1.0); }
}

function openBook(url, title) {
  document.getElementById('book-frame').src = url;
  showPage('reader');
  saveHistory(title, url);
  if(window.logToFirebase) window.logToFirebase(title);
}

function fadeVolume(target) {
  if(bgMusic.paused) return;
  let v = bgMusic.volume;
  const interval = setInterval(() => {
    if(v < target) v = Math.min(v + 0.05, target);
    else v = Math.max(v - 0.05, target);
    bgMusic.volume = v;
    if(v === target) clearInterval(interval);
  }, 50);
}

function toggleMusic() {
  if(bgMusic.paused) {
    bgMusic.play();
    document.getElementById('music-text').textContent = "Pause";
    eqBars.forEach(b => b.style.animationPlayState = 'running');
  } else {
    bgMusic.pause();
    document.getElementById('music-text').textContent = "Music";
    eqBars.forEach(b => b.style.animationPlayState = 'paused');
  }
}

function saveHistory(title, url) {
  let h = JSON.parse(localStorage.getItem('lib_h')) || [];
  h = h.filter(x => x.title !== title);
  h.unshift({title, url, date: new Date().toLocaleDateString()});
  localStorage.setItem('lib_h', JSON.stringify(h.slice(0, 8)));
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem('lib_h')) || [];
  const list = document.getElementById('history-list');
  list.innerHTML = h.map(x => `
    <div class="book-item" style="animation:none;">
      <div class="book-box" style="height:180px; background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('${x.url}', '${x.title}')"></div>
      <p style="font-size:0.7em; margin-top:10px;">${x.title}<br><span style="opacity:0.5">${x.date}</span></p>
    </div>
  `).join('');
}
</script>
</body>
</html>
