<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smanda's Elegant Library</title>

<link rel="manifest" href="data:application/manifest+json,{'name':'Smanda Library','short_name':'SmandaLib','start_url':'.','display':'standalone','background_color':'#1a0f0d','theme_color':'#d4af37'}">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();
  const ADMIN_EMAILS = ["arvnn.ad4m@gmail.com", "admin2@gmail.com"];

  // --- 2.2 PWA: Service Worker Registration ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('https://cdn.jsdelivr.net/npm/workbox-sw@latest/build/workbox-sw.js');
    });
  }

  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => console.error("Login gagal:", err.message));
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.userEmail = user.email;
      window.userName = user.displayName || user.email.split('@')[0];
      const isAdmin = ADMIN_EMAILS.includes(user.email);
      
      document.getElementById('user-greeting').innerHTML = `Halo, ${isAdmin ? 'Admin ' : ''}<span style="color:#d4af37; font-weight:bold;">${window.userName}</span>!`;
      
      if(isAdmin) {
        document.getElementById('admin-nav-btn').style.display = 'flex';
        document.getElementById('admin-upload-section').style.display = 'block';
        document.getElementById('admin-manage-section').style.display = 'block';
      }

      const lp = document.getElementById('landing-page');
      lp.style.opacity = '0';
      setTimeout(() => { lp.style.display = 'none'; }, 800);
      
      listenToFirebaseHistory();
      listenToNewBooks();
    }
  });

  // --- 2.3 Search Discovery (Title + Description) ---
  window.filterBooks = function() {
    const queryStr = document.getElementById('search-input').value.toLowerCase();
    const books = document.querySelectorAll('.book-item');
    books.forEach(book => {
      const title = book.querySelector('.book-title').innerText.toLowerCase();
      const desc = book.getAttribute('data-desc') || "";
      book.style.display = (title.includes(queryStr) || desc.toLowerCase().includes(queryStr)) ? "flex" : "none";
    });
  };

  function listenToNewBooks() {
    const container = document.getElementById('dynamic-books');
    // --- 2.1 Skeleton Screen ---
    container.innerHTML = `<div class="skeleton-book"></div><div class="skeleton-book"></div>`;

    onValue(ref(db, 'books'), (snapshot) => {
      const data = snapshot.val();
      container.innerHTML = "";
      if (data) {
        Object.entries(data).forEach(([key, book]) => {
          const item = document.createElement('div');
          item.className = "book-item";
          item.setAttribute('data-desc', book.desc);
          item.innerHTML = `
            <div class="book-tooltip">${book.desc}</div>
            <div class="book-box" style="background-image: url('${book.cover}');" onclick="openBook('${book.url}', '${book.title}', '${book.cover}')"></div>
            <p class="book-title">${book.title}</p>
          `;
          container.appendChild(item);
        });
      }
    });
  }

  // --- 4.1 Dynamic Covers on History ---
  window.openBook = function(url, title, cover) {
    document.getElementById('book-frame').src = url;
    showPage('reader');
    if (window.userEmail) {
      const safeEmail = window.userEmail.replace(/\./g, ',');
      const bookId = btoa(title).replace(/=/g, ''); 
      set(ref(db, 'user_histories/' + safeEmail + '/' + bookId), {
        title, url, cover, time: new Date().toLocaleDateString('id-ID'), timestamp: Date.now()
      });
    }
  };

  function listenToFirebaseHistory() {
    const safeEmail = window.userEmail.replace(/\./g, ',');
    onValue(ref(db, 'user_histories/' + safeEmail), (snapshot) => {
      const data = snapshot.val();
      const list = document.getElementById('history-list');
      if (!data) {
        list.innerHTML = "<p style='opacity:0.5;'>Belum ada riwayat.</p>";
        return;
      }
      const historyArray = Object.values(data).sort((a, b) => b.timestamp - a.timestamp);
      list.innerHTML = historyArray.slice(0, 8).map(x => `
        <div class="book-item history-item">
          <div class="book-box" style="height:180px; background-image: url('${x.cover}');" onclick="openBook('${x.url}', '${x.title}', '${x.cover}')"></div>
          <p class="book-title" style="font-size:0.7em;">${x.title}</p>
        </div>
      `).join('');
    });
  }
</script>

<style>
* { box-sizing: border-box; }
body { margin: 0; background: #1a0f0d; color: #efebe9; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }

/* --- 2.1 Skeleton Screen Animation --- */
.skeleton-book { width: 160px; height: 230px; background: linear-gradient(90deg, #2d1b18 25%, #3d2b27 50%, #2d1b18 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

/* --- 4.3 Micro-Interactions (Hover Glow) --- */
.book-box { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease; }
.book-box:hover { transform: scale(1.08) translateY(-10px); box-shadow: 0 0 25px rgba(212, 175, 55, 0.5); }

/* --- 4.4 Smooth Page Transition --- */
.page { display: none; opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s ease; width: 100%; padding-bottom: 120px; }
.page.active { display: block; opacity: 1; transform: translateY(0); }

/* UI Restyle */
.library-shelf { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 40px; background: rgba(0,0,0,0.2); border-radius: 15px; border: 1px solid rgba(212, 175, 55, 0.1); }
.book-item { display: flex; flex-direction: column; align-items: center; width: 160px; position: relative; }
.book-title { margin-top: 15px; text-align: center; font-size: 0.9em; font-weight: bold; color: #d4af37; }
.search-input { width: 100%; max-width: 400px; padding: 12px; border-radius: 25px; border: 1px solid #d4af37; background: #2d1b18; color: white; margin-bottom: 30px; text-align: center; }

#landing-page { position: fixed; inset: 0; background: #1a0f0d; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
nav { position: fixed; bottom: 0; width: 100%; background: rgba(26, 15, 13, 0.95); display: flex; justify-content: center; gap: 10px; padding: 15px; border-top: 1px solid #d4af37; z-index: 100; }
.nav-btn { background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
#reader { position: fixed; inset: 0; background: #000; z-index: 2000; }
iframe { width: 100%; height: calc(100vh - 60px); border: none; }
</style>
</head>
<body>

<div id="landing-page">
  <h2 style="color:#d4af37; letter-spacing: 5px;">SMANDA LIBRARY</h2>
  <button class="nav-btn" onclick="startLibrary()">Login with Google</button>
</div>

<div id="home" class="page active">
  <div style="text-align: center; padding: 40px 20px;">
    <h1 id="user-greeting" style="font-size: 1.2em; opacity: 0.8;">Selamat Datang...</h1>
    <input type="text" id="search-input" class="search-input" placeholder="Cari judul atau topik..." onkeyup="filterBooks()">
    <div class="library-shelf">
      <div id="dynamic-books" style="display:contents"></div>
    </div>
  </div>
</div>

<div id="history-page" class="page">
  <div style="text-align: center; padding: 40px;">
    <h2 style="color:#d4af37;">History Membaca</h2>
    <div id="history-list" style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center;"></div>
  </div>
</div>

<div id="reader" class="page">
  <button class="nav-btn" style="width:100%; border-radius:0;" onclick="showPage('home')">← KEMBALI KE RAK</button>
  <iframe id="book-frame" src=""></iframe>
</div>

<nav>
  <button class="nav-btn" onclick="showPage('home')">Lobby</button>
  <button class="nav-btn" onclick="showPage('history-page')">History</button>
  <button class="nav-btn" id="admin-nav-btn" style="display:none;" onclick="showPage('admin-page')">Admin</button>
</nav>

<script>
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => {
      p.classList.remove('active');
      p.style.display = 'none';
    });
    const activePage = document.getElementById(id);
    activePage.style.display = 'block';
    setTimeout(() => activePage.classList.add('active'), 50);
  }
</script>

</body>
</html>
