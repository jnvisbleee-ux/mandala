<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549",
    measurementId: "G-3Y8HD5WFH7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const ADMIN_EMAIL = "arvnn.ad4m@gmail.com";

  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => {
      alert("Login gagal: " + err.message);
    });
  };

  window.logoutLibrary = function() {
    if(confirm("Apakah Anda yakin ingin keluar?")) {
      signOut(auth).then(() => {
        location.reload(); 
      });
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.currentUser = user.displayName;
      window.userEmail = user.email;
      document.getElementById('user-greeting').textContent = "Halo, " + user.displayName + "!";
      
      // Cek Admin
      if(user.email === ADMIN_EMAIL) {
        document.getElementById('admin-nav-btn').style.display = 'flex';
      }

      const lp = document.getElementById('landing-page');
      lp.style.opacity = '0';
      setTimeout(() => { lp.style.display = 'none'; }, 800);
      
      renderHistory();
    }
  });
</script>

<style>
/* --- BASE CSS & ANIMATIONS --- */
#landing-page {

.welcome-title {

body {

  background: #1a0f0d; background-image: radial-gradient(circle at center, #3d2b27 0%, #1a0f0d 100%);

}

.main-container { width: 100%; max-width: 1100px; margin: 40px auto; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
.logo-main { width: 80px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.2)); }

/* SEARCH BAR */
.search-wrapper { margin-bottom: 30px; width: 100%; max-width: 400px; position: relative; }
.search-input {
  width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid rgba(212, 175, 55, 0.4);

}
.search-input:focus { border-color: #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }

/* LIBRARY SHELF */
.library-shelf {
  width: 100%; background: #2d1b18; border: 12px solid #1a0f0d;
  box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 0 30px 60px rgba(0,0,0,0.6);
  padding: 80px 20px 40px 20px; position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; border-radius: 4px; box-sizing: border-box;
}

.shelf-lamp { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 160px; height: 15px; background: linear-gradient(to bottom, #444, #222); border-bottom: 3px solid #d4af37; border-radius: 8px 8px 0 0; z-index: 10; }
.lamp-glow { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 700px; height: 350px; background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.15) 0%, transparent 75%); pointer-events: none; }

.book-item { display: flex; flex-direction: column; align-items: center; width: 170px; z-index: 2; margin-bottom: 20px; position: relative; animation: float-book 6s ease-in-out infinite; transition: 0.5s; }
@keyframes float-book { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

.book-box {
  width: 160px; height: 230px; background-size: cover; background-position: center; border-radius: 2px 8px 8px 2px; cursor: pointer; position: relative; transition: all 0.5s; box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
  -webkit-box-reflect: below 2px linear-gradient(transparent, transparent 50%, rgba(255,255,255,0.1));
}
.book-box:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); }

.book-title {
  margin-top: 25px; font-weight: bold; font-size: 0.9em; text-align: center; line-height: 1.4; color: #d7ccc8;
}

/* ADMIN TABLE */
.admin-card { background: rgba(212, 175, 55, 0.05); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 15px; width: 100%; padding: 20px; margin-top: 20px; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
th { text-align: left; border-bottom: 1px solid #d4af37; padding: 10px; color: #d4af37; }
td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }

/* FOOTER NAV */
nav {
  position: fixed; bottom: 0; width: 100%; background: rgba(26, 15, 13, 0.95); backdrop-filter: blur(8px);
  display: flex; justify-content: center; gap: 10px; padding: 15px 0; z-index: 100; border-top: 1px solid rgba(212, 175, 55, 0.2);
}
.nav-btn {
  background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 8px 18px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 0.8em;
}
.nav-btn:hover { background: #d4af37; color: #1a0f0d; }
.equalizer { display: flex; align-items: flex-end; gap: 3px; height: 18px; width: 22px; }
.eq-bar { width: 4px; background: #fff59d; animation: eq-anim 0.5s ease-in-out infinite alternate; animation-play-state: paused; border-radius: 1px; }
@keyframes eq-anim { 0% { height: 4px; } 100% { height: 18px; } }

.page { display: none; width: 100%; padding-bottom: 120px; }
.active { display: block; }
#reader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; }
iframe { width: 100%; height: calc(100vh - 65px); border: none; }
.btn-back { background: #2b1d1a; color: #d4af37; border: none; padding: 20px; width: 100%; cursor: pointer; font-weight: bold; }

@keyframes textShine { to { background-position: 200% center; } }
</style>
</head>

    <div class="search-wrapper">

  <button class="nav-btn" id="admin-nav-btn" style="display:none;" onclick="playClick(); showPage('admin-page')">Admin</button>

    <span id="music-text">Music</span>
    <div class="equalizer">
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    </div>
  </button>
  <button class="nav-btn" style="border-color:#ff5252; color:#ff5252;" onclick="logoutLibrary()">Logout</button>
</nav>

<script>
const bgMusic = document.getElementById('bg-music');
const musicBtn = document.getElementById('music-toggle');
const eqBars = document.querySelectorAll('.eq-bar');

function filterBooks() {
  const query = document.getElementById('search-bar').value.toLowerCase();
  const books = document.querySelectorAll('.book-item');
  books.forEach(book => {
    const title = book.getAttribute('data-title').toLowerCase();
    book.style.display = title.includes(query) ? 'flex' : 'none';
  });
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'home' || id === 'history-page' || id === 'admin-page') { 
    document.getElementById('book-frame').src = ""; fadeVolume(1.0); 
  } else if(id === 'reader') { 
    fadeVolume(0.3); 
  }
  window.scrollTo(0,0);
}

function toggleMusic() {
  if (bgMusic.paused) {
    bgMusic.play();
    document.getElementById('music-text').textContent = "Pause";
    eqBars.forEach(bar => bar.style.animationPlayState = 'running');
  } else {
    bgMusic.pause();
    document.getElementById('music-text').textContent = "Music";
    eqBars.forEach(bar => bar.style.animationPlayState = 'paused');
  }
}

function fadeVolume(target) {
  if (bgMusic.paused) return;
  let v = bgMusic.volume;
  const i = setInterval(() => {
    if (v < target) v = Math.min(v + 0.05, target);
    else v = Math.max(v - 0.05, target);
    bgMusic.volume = v;
    if (v === target) clearInterval(i);
  }, 50);
}

function openBook(url, title){ 
  saveHistory(title, url);
  document.getElementById('book-frame').src = url; 
  showPage('reader'); 
}

function saveHistory(title, url) {
  let key = "smanda_history_" + (window.userEmail || "guest");
  let history = JSON.parse(localStorage.getItem(key)) || [];
  history = history.filter(item => item.title !== title);
  history.unshift({ title, url, date: new Date().toLocaleDateString() });
  if (history.length > 10) history.pop();
  localStorage.setItem(key, JSON.stringify(history));
}

function renderHistory() {
  const key = "smanda_history_" + (window.userEmail || "guest");
  const history = JSON.parse(localStorage.getItem(key)) || [];
  const list = document.getElementById('history-list');
  list.innerHTML = history.length > 0 ? history.map(h => `
    <div class="book-item" style="animation:none;">
      <div class="book-box" style="width:120px; height:170px; background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('${h.url}', '${h.title}')"></div>
      <p class="book-title" style="font-size:0.7em;">${h.title}<br><span style="opacity:0.5; font-size:0.8em;">${h.date}</span></p>
    </div>
  `).join('') : '<p style="text-align:center; width:100%; opacity:0.5;">Belum ada riwayat baca.</p>';
}

function playClick() { const sfx = document.getElementById('click-sfx'); sfx.currentTime = 0; sfx.play(); }
</script>
