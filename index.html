<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smanda's Elegant Library</title>

<script type="module">
  // --- FIREBASE CORE SYSTEM ---
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();
  
  const ADMIN_EMAILS = ["arvnn.ad4m@gmail.com", "admin2@gmail.com", "kicawmania@gmail.com"]; 

  // --- EXPOSE FUNCTIONS TO WINDOW (Agar bisa dipanggil onClick) ---
  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => alert("Login Google Gagal: " + err.message));
  };

  window.loginEmail = function() {
    const email = document.getElementById('email-input').value;
    const pass = document.getElementById('pass-input').value;
    if(email && pass) {
      signInWithEmailAndPassword(auth, email, pass)
        .catch((err) => alert("Login Gagal: Periksa Email/Password anda"));
    } else {
      alert("Isi email dan password dulu ya");
    }
  };

  window.registerEmail = function() {
    const email = document.getElementById('email-input').value;
    const pass = document.getElementById('pass-input').value;
    if(email && pass) {
      createUserWithEmailAndPassword(auth, email, pass)
        .then(() => alert("Akun berhasil dibuat! Silakan login."))
        .catch((err) => alert("Gagal Daftar: " + err.message));
    }
  };

  window.logoutLibrary = function() {
    if(confirm("Apakah Anda yakin ingin keluar?")) {
      signOut(auth).then(() => location.reload());
    }
  };

  // --- SESSION CHECKER ---
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.userEmail = user.email;
      window.userName = user.displayName || user.email.split('@')[0];
      
      // Admin Check
      if(ADMIN_EMAILS.includes(user.email)) {
        const adminBtn = document.getElementById('admin-nav-btn');
        const adminUpload = document.getElementById('admin-upload-section');
        if(adminBtn) adminBtn.style.display = 'flex';
        if(adminUpload) adminUpload.style.display = 'block';
        listenToUserLogs();
      }

      // Hide Landing Page
      const lp = document.getElementById('landing-page');
      if(lp) {
        lp.style.opacity = '0';
        setTimeout(() => { lp.style.display = 'none'; }, 800);
      }
      
      renderHistory(); 
      listenToNewBooks();
    }
  });

  // --- DATA LOGIC ---
  function listenToNewBooks() {
    onValue(ref(db, 'books'), (snapshot) => {
      window.allBooks = snapshot.val();
      updateLibraryUI(window.allBooks);
    });
  }

  window.logToFirebase = function(bookTitle, bookUrl) {
    if (!window.userEmail) return;
    const safeEmail = window.userEmail.replace(/\./g, ',');
    const now = new Date().toLocaleString('id-ID');
    
    set(ref(db, 'logs/' + safeEmail), {
      name: window.userName,
      email: window.userEmail,
      lastRead: bookTitle,
      time: now
    });

    const historyRef = ref(db, `users/${safeEmail}/history/${bookTitle.replace(/[^a-zA-Z0-9]/g, '')}`);
    set(historyRef, { title: bookTitle, url: bookUrl, time: now });
  };

  window.renderHistory = function() {
    if (!window.userEmail) return;
    const safeEmail = window.userEmail.replace(/\./g, ',');
    const list = document.getElementById('history-list');

    onValue(ref(db, `users/${safeEmail}/history`), (snapshot) => {
      const data = snapshot.val();
      if (data && list) {
        list.innerHTML = Object.values(data).map(x => `
          <div class="book-item">
            <div class="book-box" style="height:150px; background-size: contain; background-repeat: no-repeat; background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('${x.url}', '${x.title}')">
            </div>
            <p class="book-title" style="font-size:0.7em;">${x.title}<br>
            <span style="opacity:0.5">${x.time}</span></p>
          </div>
        `).join('');
      } else if (list) {
        list.innerHTML = "<p style='opacity:0.5; grid-column: 1/-1;'>Belum ada riwayat membaca.</p>";
      }
    });
  };

  window.openBook = function(url, title){
    window.logToFirebase(title, url);
    document.getElementById('book-frame').src = url;
    showPage('reader');
  };

  window.filterBooks = function() {
    const searchTerm = document.getElementById('search-input').value.toLowerCase();
    const filtered = {};
    if(window.allBooks) {
        Object.entries(window.allBooks).forEach(([key, book]) => {
            if(book.title.toLowerCase().includes(searchTerm)) filtered[key] = book;
        });
    }
    updateLibraryUI(filtered, searchTerm);
    document.querySelectorAll('.static-book').forEach(book => {
        const title = book.querySelector('.book-title').innerText.toLowerCase();
        book.style.display = title.includes(searchTerm) ? "flex" : "none";
    });
  };

  function updateLibraryUI(data, filterText = "") {
      const container = document.getElementById('dynamic-books');
      if (!container) return;
      if (data && Object.keys(data).length > 0) {
        const bookEntries = Object.entries(data);
        container.innerHTML = bookEntries.map(([key, book]) => `
          <div class="book-item">
            <div class="book-box" style="background-image: url('${book.cover}');" onclick="playClick(); openBook('${book.url}', '${book.title}')"></div>
            <p class="book-title">${book.title}</p>
          </div>
        `).join('');
      } else { container.innerHTML = ""; }
  }

  function listenToUserLogs() {
    onValue(ref(db, 'logs'), (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('admin-log-body');
      if (data && tbody) {
        tbody.innerHTML = Object.values(data).map(user => `
          <tr><td>${user.name}</td><td style="font-size:0.8em">${user.email}</td><td style="color:#d4af37; font-weight:bold">${user.lastRead}</td><td style="font-size:0.8em; opacity:0.6">${user.time}</td></tr>
        `).join('');
      }
    });
  }
</script>

<style>
/* --- STYLE TETAP SAMA --- */
#landing-page {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle, #4e342e 0%, #1a0f0d 100%); 
  display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.8s ease;
}
.logo-landing { width: 100px; margin-bottom: 10px; }
.welcome-title {
  font-size: 2em; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; text-align: center;
  color: #d7ccc8;
}
.login-box {
  background: rgba(45, 27, 24, 0.8); padding: 25px; border-radius: 15px; border: 1px solid #d4af37;
  width: 300px; display: flex; flex-direction: column; gap: 10px;
}
.login-input {
  background: rgba(26, 15, 13, 0.9); border: 1px solid rgba(212, 175, 55, 0.5); 
  padding: 10px; color: white; border-radius: 5px; outline: none;
}
.enter-btn { background: #5d4037; color: #fff; border: 1px solid #d4af37; padding: 10px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 0.8em; }
.google-btn { background: #fff; color: #444; border: none; }

body {
  margin: 0; padding: 0; font-family: sans-serif;
  background: #1a0f0d; color: #efebe9; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
}

.main-container { width: 100%; max-width: 1100px; margin: 40px auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }

.search-input {
    width: 100%; max-width: 400px; padding: 12px 20px; background: rgba(45, 27, 24, 0.6); 
    border: 1px solid #d4af37; border-radius: 25px; color: white; margin-bottom: 30px; text-align: center;
}

.library-shelf {
  width: 100%; background: #2d1b18; border: 12px solid #1a0f0d;
  padding: 60px 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; border-radius: 4px; box-sizing: border-box;
}

.book-item { display: flex; flex-direction: column; align-items: center; width: 170px; }
.book-box {
  width: 160px; height: 230px; background-size: cover; background-position: center; border-radius: 2px 8px 8px 2px; cursor: pointer; transition: 0.3s;
}
.book-box:hover { transform: scale(1.05); }
.book-title { margin-top: 15px; font-weight: bold; font-size: 0.9em; text-align: center; }

#history-list .book-box { background-size: contain !important; background-repeat: no-repeat; }
#history-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; width: 100%; padding-bottom: 120px; }

.admin-card { width: 100%; max-width: 900px; background: rgba(0,0,0,0.3); padding: 20px; border: 1px solid #d4af37; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); text-align: left; }

nav {
  position: fixed; bottom: 0; width: 100%; background: rgba(26, 15, 13, 0.95);
  display: flex; justify-content: center; gap: 10px; padding: 15px 0; z-index: 100;
}
.nav-btn { background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 0.8em; font-weight: bold; }

.page { display: none; width: 100%; }
.active { display: block; }
#reader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; display:none; flex-direction: column;}
#reader.active { display: flex; }
iframe { width: 100%; flex-grow: 1; border: none; }
.reader-header { background: #1a0f0d; padding: 10px; border-bottom: 1px solid #d4af37; }
</style>
</head>

<body>

<audio id="click-sfx" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="bg-music" src="https://raw.githubusercontent.com/arvnnad4m-jpg/chill-backsound/bdf81b6bee6dd2efd7219431a2f09b4a9132e533/felixdump-love-shine-by-leeheesang-instrumental.mp3" loop></audio>

<div id="landing-page">
  <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" class="logo-landing">
  <div class="welcome-title">Smanda Library</div>
  <div class="login-box">
    <input type="email" id="email-input" class="login-input" placeholder="Email Address">
    <input type="password" id="pass-input" class="login-input" placeholder="Password">
    <button class="enter-btn" onclick="loginEmail()">Login Email</button>
    <button class="enter-btn" style="background:transparent; border:none; font-size:0.65em; opacity:0.7" onclick="registerEmail()">Belum punya akun? Daftar</button>
    <div style="text-align:center; color:#d4af37; font-size:0.8em; margin:5px 0;">OR</div>
    <button class="enter-btn google-btn" onclick="startLibrary()">Login with Google</button>
  </div>
</div>

<div id="home" class="page active">
  <div class="main-container">
    <h2 class="welcome-title">Digital Archive</h2>
    <input type="text" id="search-input" class="search-input" placeholder="Cari majalah..." onkeyup="filterBooks()">
    <div class="library-shelf">
      <div id="dynamic-books" style="display:contents"></div>
      <div class="book-item static-book">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('https://heyzine.com/flip-book/08b8d4b8c7.html', 'Smanda Vibes (February)')"></div>
        <p class="book-title">Smanda Vibes<br>(February Edition)</p>
      </div>
      </div>
  </div>
</div>

<div id="history-page" class="page">
  <div class="main-container">
    <h2 class="welcome-title">History</h2>
    <div id="history-list"></div>
  </div>
</div>

<div id="admin-page" class="page">
  <div class="main-container">
    <h2 class="welcome-title">Admin</h2>
    <div class="admin-card">
      <h3 style="color:#d4af37;">User Activity</h3>
      <table><thead><tr><th>User</th><th>Email</th><th>Reading</th><th>Waktu</th></tr></thead><tbody id="admin-log-body"></tbody></table>
    </div>
  </div>
</div>

<div id="reader" class="page">
  <div class="reader-header">
    <button class="nav-btn" onclick="showPage('home')">← KELUAR</button>
  </div>
  <iframe id="book-frame" src=""></iframe>
</div>

<nav>
  <button class="nav-btn" onclick="showPage('home')">Lobby</button>
  <button class="nav-btn" onclick="showPage('history-page')">History</button>
  <button class="nav-btn" id="admin-nav-btn" style="display:none;" onclick="showPage('admin-page')">Admin</button>
  <button class="nav-btn" onclick="logoutLibrary()" style="color:#ff5252;">Logout</button>
</nav>

<script>
function playClick() { document.getElementById('click-sfx').play(); }
function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
