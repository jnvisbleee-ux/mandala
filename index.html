<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smanda's Elegant Library</title>

<script type="module">
  // --- FIREBASE CORE SYSTEM ---
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsYNPWyoeERQ1tVolEyVIqNf8GSFkhbGY",
    authDomain: "mandala-b17d0.firebaseapp.com",
    databaseURL: "https://mandala-b17d0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mandala-b17d0",
    storageBucket: "mandala-b17d0.firebasestorage.app",
    messagingSenderId: "979224717164",
    appId: "1:979224717164:web:6ec6d5e3545821fa22b549"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();
  
  const ADMIN_EMAILS = ["arvnn.ad4m@gmail.com", "admin2@gmail.com", "kicawmania@gmail.com"]; 

  window.startLibrary = function() {
    signInWithPopup(auth, provider).catch((err) => console.error("Login gagal:", err.message));
  };

  window.loginEmail = function() {
    const email = document.getElementById('email-input').value;
    const pass = document.getElementById('pass-input').value;
    if(email && pass) {
      signInWithEmailAndPassword(auth, email, pass).catch((err) => console.error("Error:", err.message));
    }
  };

  window.registerEmail = function() {
    const email = document.getElementById('email-input').value;
    const pass = document.getElementById('pass-input').value;
    if(email && pass) {
      createUserWithEmailAndPassword(auth, email, pass).catch((err) => console.error("Error:", err.message));
    }
  };

  window.logoutLibrary = function() {
    if(confirm("Apakah Anda yakin ingin keluar?")) {
      signOut(auth).then(() => location.reload());
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.userEmail = user.email;
      window.userName = user.displayName || user.email.split('@')[0];
      
      if(ADMIN_EMAILS.includes(user.email)) {
        document.getElementById('admin-nav-btn').style.display = 'flex';
        document.getElementById('admin-upload-section').style.display = 'block';
        document.getElementById('admin-manage-section').style.display = 'block';
        listenToUserLogs();
      }

      const lp = document.getElementById('landing-page');
      lp.style.opacity = '0';
      setTimeout(() => { lp.style.display = 'none'; }, 800);
      renderHistory();
      listenToNewBooks();
    }
  });

  function listenToNewBooks() {
    onValue(ref(db, 'books'), (snapshot) => {
      window.allBooks = snapshot.val();
      updateLibraryUI(window.allBooks);
    });
  }

  window.logToFirebase = function(bookTitle, progress) {
    if (!window.userEmail) return;
    const safeEmail = window.userEmail.replace(/\./g, ',');
    set(ref(db, 'logs/' + safeEmail), {
      name: window.userName,
      email: window.userEmail,
      lastRead: `${bookTitle} (${progress}%)`,
      time: new Date().toLocaleString('id-ID')
    });
  };

  function listenToUserLogs() {
    onValue(ref(db, 'logs'), (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('admin-log-body');
      if (data) {
        tbody.innerHTML = Object.values(data).map(user => `
          <tr>
            <td>${user.name}</td>
            <td style="font-size:0.8em">${user.email}</td>
            <td style="color:#d4af37; font-weight:bold">${user.lastRead}</td>
            <td style="font-size:0.8em; opacity:0.6">${user.time}</td>
          </tr>
        `).join('');
      }
    });
  }
</script>

<style>
/* --- BASE STYLE & DESIGN PRESERVATION --- */
#landing-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #4e342e 0%, #1a0f0d 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.8s ease; overflow-y: auto; padding: 20px 0; }
.welcome-title { font-size: 2em; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; text-align: center; background: linear-gradient(to right, #d7ccc8 20%, #fff 50%, #d7ccc8 80%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: textShine 4s linear infinite; color: #d7ccc8; }
.login-box { background: rgba(45, 27, 24, 0.8); padding: 25px; border-radius: 15px; border: 1px solid #d4af37; width: 300px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.login-input { background: rgba(26, 15, 13, 0.9); border: 1px solid rgba(212, 175, 55, 0.5); padding: 10px; color: white; border-radius: 5px; outline: none; }
.enter-btn { background: #5d4037; color: #fff; border: 1px solid #d4af37; padding: 10px; border-radius: 30px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 0.8em; }

body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #1a0f0d; background-image: radial-gradient(circle at center, #3d2b27 0%, #1a0f0d 100%); color: #efebe9; min-height: 100vh; overflow-x: hidden; }

/* SEARCH BAR */
.search-container { width: 100%; max-width: 400px; margin-bottom: 30px; }
.search-input { width: 100%; padding: 12px 20px; background: rgba(45, 27, 24, 0.6); border: 1px solid #d4af37; border-radius: 25px; color: white; outline: none; box-sizing: border-box; text-align: center; }

/* SHELF */
.library-shelf { width: 100%; background: #2d1b18; border: 12px solid #1a0f0d; box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 0 30px 60px rgba(0,0,0,0.6); padding: 80px 20px 40px 20px; position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; border-radius: 4px; box-sizing: border-box; }
.shelf-lamp { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 160px; height: 15px; background: linear-gradient(to bottom, #444, #222); border-bottom: 3px solid #d4af37; border-radius: 8px 8px 0 0; z-index: 10; }

.book-item { display: flex; flex-direction: column; align-items: center; width: 160px; z-index: 2; position: relative; }
.book-box { width: 150px; height: 215px; background-size: cover; background-position: center; border-radius: 2px 8px 8px 2px; cursor: pointer; transition: 0.5s; box-shadow: -5px 5px 15px rgba(0,0,0,0.5); }
.book-title { margin-top: 15px; font-weight: bold; font-size: 0.85em; text-align: center; color: #d7ccc8; }

/* PROGRESS UI IN HISTORY */
.progress-container { width: 80%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 10px; margin-top: 8px; border: 1px solid rgba(212, 175, 55, 0.3); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #d4af37, #fdd835); width: 0%; transition: width 0.5s; }
.progress-text { font-size: 0.65em; color: #d4af37; margin-top: 4px; font-weight: bold; }

/* READER PROGRESS TRACKER (Overlay) */
.reader-controls {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(26, 15, 13, 0.9); padding: 15px 25px; border-radius: 40px;
  border: 1px solid #d4af37; display: flex; align-items: center; gap: 15px;
  z-index: 3000; box-shadow: 0 0 20px rgba(0,0,0,0.8);
}
.prog-slider { cursor: pointer; accent-color: #d4af37; width: 200px; }

/* FIX HISTORY GRID */
#history-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 40px 20px; width: 100%; max-width: 1000px; margin-top: 30px; padding-bottom: 150px;
}

nav { position: fixed; bottom: 0; width: 100%; background: rgba(26, 15, 13, 0.95); backdrop-filter: blur(8px); display: flex; justify-content: center; gap: 15px; padding: 20px 0; z-index: 100; border-top: 1px solid rgba(212, 175, 55, 0.2); }
.nav-btn { background: #4e342e; color: #d4af37; border: 1px solid #d4af37; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 0.8em; }

.page { display: none; width: 100%; }
.active { display: block; }
#reader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; }
iframe { width: 100%; height: 100%; border: none; }
</style>
</head>

<body>

<audio id="click-sfx" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="bg-music" src="https://raw.githubusercontent.com/arvnnad4m-jpg/chill-backsound/bdf81b6bee6dd2efd7219431a2f09b4a9132e533/felixdump-love-shine-by-leeheesang-instrumental.mp3" loop></audio>

<div id="landing-page">
  <img src="https://sman2kuningan.sch.id/wp-content/themes/mading/images/logo.png" style="width:100px;">
  <div class="welcome-title">Smanda Library</div>
  <div class="login-box">
    <input type="email" id="email-input" class="login-input" placeholder="Email Address">
    <input type="password" id="pass-input" class="login-input" placeholder="Password">
    <button class="enter-btn" onclick="loginEmail()">Login</button>
    <button class="enter-btn" style="background:#fff; color:#444;" onclick="startLibrary()">Google Login</button>
  </div>
</div>

<div id="home" class="page active">
  <div class="main-container">
    <h2 class="welcome-title">Digital Archive</h2>
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Cari majalah..." onkeyup="filterBooks()">
    </div>
    <div class="library-shelf">
      <div id="dynamic-books" style="display:contents"></div>
      <div class="book-item static-book">
        <div class="book-box" style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg');" onclick="openBook('https://heyzine.com/flip-book/905f390c0d.html', 'Smanda Vibes (Nov)')"></div>
        <p class="book-title">Smanda Vibes (Nov)</p>
      </div>
    </div>
  </div>
</div>

<div id="history-page" class="page">
  <div class="main-container">
    <h2 class="welcome-title">Reading History</h2>
    <div id="history-list"></div>
  </div>
</div>

<div id="reader" class="page">
  <div class="reader-controls">
    <span style="color:#d4af37; font-size:0.8em; font-weight:bold;">PROGRES:</span>
    <input type="range" id="manual-prog" class="prog-slider" min="0" max="100" value="0" oninput="updateProgVal(this.value)">
    <span id="prog-val" style="color:#fff; font-size:0.8em; width:35px;">0%</span>
    <button class="nav-btn" style="padding:5px 15px;" onclick="closeReader()">SIMPAN & KELUAR</button>
  </div>
  <iframe id="book-frame" src="" allowfullscreen></iframe>
</div>

<nav>
  <button class="nav-btn" onclick="showPage('home')">Lobby</button>
  <button class="nav-btn" onclick="renderHistory(); showPage('history-page')">History</button>
  <button class="nav-btn" onclick="logoutLibrary()" style="color:#ff5252;">Logout</button>
</nav>

<script>
let currentBook = "";
const bgMusic = document.getElementById('bg-music');

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openBook(url, title){
  currentBook = title;
  const h = JSON.parse(localStorage.getItem('lib_history')) || [];
  const existing = h.find(x => x.title === title);
  
  // Set slider ke progres terakhir
  const lastProg = existing ? existing.progress : 0;
  document.getElementById('manual-prog').value = lastProg;
  document.getElementById('prog-val').innerText = lastProg + "%";
  
  document.getElementById('book-frame').src = url;
  showPage('reader');
  bgMusic.volume = 0.2;
}

function updateProgVal(v) {
    document.getElementById('prog-val').innerText = v + "%";
}

function closeReader() {
    const finalProg = document.getElementById('manual-prog').value;
    saveHistory(currentBook, finalProg);
    document.getElementById('book-frame').src = "";
    showPage('home');
    bgMusic.volume = 1.0;
}

function saveHistory(title, prog) {
    let h = JSON.parse(localStorage.getItem('lib_history')) || [];
    h = h.filter(x => x.title !== title);
    h.unshift({
        title, 
        progress: parseInt(prog), 
        time: new Date().toLocaleDateString(),
        cover: 'https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGYtczYxLWppcjAxNTFjLWwtLmpwZw.jpg'
    });
    localStorage.setItem('lib_history', JSON.stringify(h.slice(0, 12)));
    if(window.logToFirebase) window.logToFirebase(title, prog);
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem('lib_history')) || [];
  const list = document.getElementById('history-list');
  list.innerHTML = h.map(x => `
    <div class="book-item">
      <div class="book-box" style="height:180px; background-image: url('${x.cover}');" onclick="openBook('#', '${x.title}')"></div>
      <p class="book-title" style="margin-bottom:0;">${x.title}</p>
      <div class="progress-container">
        <div class="progress-fill" style="width: ${x.progress}%"></div>
      </div>
      <span class="progress-text">${x.progress}% Dibaca</span>
    </div>
  `).join('');
}

function filterBooks() {
    const s = document.getElementById('search-input').value.toLowerCase();
    document.querySelectorAll('.static-book').forEach(b => {
        b.style.display = b.innerText.toLowerCase().includes(s) ? "flex" : "none";
    });
}
</script>

</body>
</html>
